[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suburn"
version = "0.1.0"
description = "A plug-and-play CLI for transcribing videos with whisperfile and burning subtitles with ffmpeg."
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Suburn Contributors" },
]
keywords = ["subtitles", "video", "whisper", "transcription", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "platformdirs>=4.0.0",
]

[project.scripts]
suburn = "suburn.cli:app"

[project.urls]
Homepage = "https://github.com/blasferna/suburn"
Repository = "https://github.com/blasferna/suburn"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/suburn"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks end-to-end tests that download models/audio",
]

[tool.coverage.run]
source = ["src/suburn"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W", "UP", "B"]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
